name: CI & Adobe Exchange Readiness Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Exchange & internal unit tests
        run: npm run test:all

      - name: Build Adobe Exchange bundle & verify zero internal references
        run: npm run build:exchange
